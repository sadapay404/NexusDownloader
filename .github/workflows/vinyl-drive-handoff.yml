name: Retrieve verified Vinyl installer for Drive

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths: ['.github/workflows/vinyl-drive-handoff.yml']

permissions: {}

jobs:
  retrieve-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '45840168924'
      SOURCE_SHA: '84637f37fb5ce4d73be683fb3ca8998d2ba135dd'
      SOURCE_ARTIFACT: '15128091815'
      SOURCE_ZIP_SHA: 'c516310ef09abbef978237ca5c38f7cf8ce85743fb60d5486e5dd44ecfca910a'
    steps:
      - name: Transfer the verified Setup, encrypted for the workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status > /dev/null
          run=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,headBranch)
          jq -e --arg sha "$SOURCE_SHA" --arg branch "$GITHUB_REF_NAME" '.status == "completed" and .conclusion == "success" and .headSha == $sha and .headBranch == $branch' <<<"$run" > /dev/null
          cd "$(mktemp -d "$RUNNER_TEMP/verified-setup.XXXXXX")"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > setup.zip 2> download.err; then
            echo '::error::GitHub runner could not retrieve the verified artifact.'
            exit 1
          fi
          printf '%s  setup.zip\n' "$SOURCE_ZIP_SHA" | sha256sum -c --strict
          name=NexusDownloader-0.2.0-Windows-x64-Setup.exe
          [[ "$(unzip -Z1 setup.zip | LC_ALL=C sort)" == "$(printf '%s\n' "$name" "$name.sha256")" ]]
          unzip -qq setup.zip "$name" "$name.sha256"
          size=$(stat -c '%s' "$name")
          [[ "$size" -gt 0 && "$size" -lt 40000000 ]]
          expected=$(sha256sum "$name" | cut -d' ' -f1)
          [[ "$(tr -d '\r' < "$name.sha256")" == "$expected  $name" ]]
          cat > public.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIERzCCAq+gAwIBAgIUE+RgHFDhXG777UtibwUYIQ5jnRwwDQYJKoZIhvcNAQEL
          BQAwMzExMC8GA1UEAwwoTmV4dXNEb3dubG9hZGVyIGFydGlmYWN0IGhhbmRvZmYg
          ODQ2MzdmMzAeFw0yNjExMjYxNDM0MzBaFw0yNjExMjgxNDM0MzBaMDMxMTAvBgNV
          BAMMKE5leHVzRG93bmxvYWRlciBhcnRpZmFjdCBoYW5kb2ZmIDg0NjM3ZjMwggGi
          MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQC3RWO4lbNrsEYnnq+25a+0cabs
          536sbZCKP9iogUdjqKXVifiseSu5BOQXOlqYJMFxFb1/i7DNoT8yl0qV6duQMCEE
          I1dvdmohPqZTvtGvKdOiBawS0hoacg6OSXvW8/ZUEoAYRP1RY3Nt8Nj2U5nI2G76
          qyoUWHDDK7cLs9yPnKRatwFAZ6iSoHB5kxsTcLPlX3UJdkoALtCJWWoS/12Y7xwc
          037Si92XIbIk9ugkJA+2qKhQmeFDMayyRnF4/7fJ8moiX/xZqjrtWoqB3W8OxOJZ
          bXtdtufYh7OgFk/Rqw2tj2xp5GxuvfZFZ4W+lpyAZDX5PTYWNsOGLX+opY2OXQ+T
          nIMDfjurdorjmOgLusBDPFNu59KP11TU3ns2qLfwnqM/ZX6hy3Idhc55mOBl5LQL
          DNfY0RiOsEIAL3buyxk9mEiwVHi6Gh7nWfdFmD3B4VKI8u+Mmq3wD3AxlrZMv3Vj
          ymrCN939qhVN1fzhMEgEQQNp2oHOum27qNx40JcCAwEAAaNTMFEwHQYDVR0OBBYE
          FBrTPJlN2laMcjvlY1EZ76TywIiOMB8GA1UdIwQYMBaAFBrTPJlN2laMcjvlY1EZ
          76TywIiOMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBADSDKvpd
          6sH9HzuYM5azFAttRBinDAORclMHlEBhoCWZKDKVahZqw0dWLIs2IFJD0wlYZuG2
          SDYoakY23R/FtwpA8uW3BWzdihzIOZaJDWL/dPQ9V7kI6J8m+XPbTLhSsM+9rSAG
          Hf5rijCevfo/LqzGi8T4XdBJcWj8cXHfZbA/Eb+4QwyrsgaiLTHVm62AKLzPbccI
          CGO4jF92dFQj1aa0omv8cevt2H2h+ggTj5ksmkTebTUYsiIQsWf7NXoCvkqN7H13
          tGjqNMqW/ukZ3Wf2rdqGlfO6uIWGdaV3KaHJSZ67DTmSa5ydSAvCAu6e/Qz0n0HK
          UzOGZaB6S39wwfGKIpW76+tdhmCUnyjgB2Q6bRaUd2ZeIOnudO+I94eZxDOSWwYm
          nZDQDZwkQfQ810QAhX+OedZ5vdtvMYlPoeaDOdBmfN5pI4ipkLzKzLNHoeCfNWRw
          /W7Ybm/eSPTpEWAog8etAXtWfjRfmPggxwY3fj9342WDgcSOHTtfix7hIQ==
          -----END CERTIFICATE-----
          CERTIFICATE
          openssl cms -encrypt -binary -aes256 -in "$name" -outform DER -out setup.der public.pem
          encrypted_sha=$(sha256sum setup.der | cut -d' ' -f1)
          split -b 640k -d -a 3 setup.der chunk-
          blobs=()
          for piece in chunk-*; do
            id=$(python3 -c 'import base64,json,sys;print(json.dumps({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode("ascii")}))' < "$piece" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            [[ "$id" == "$(git hash-object "$piece")" ]]
            blobs+=("$id")
          done
          printf '::notice title=Verified Vinyl Setup 45840168924::%s %s %s %s\n' "$expected" "$encrypted_sha" "$size" "${blobs[*]}"

name: Verify Vinyl 0.2.1 in-place recovery

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths: ['.github/workflows/vinyl-recovery-check.yml']

permissions:
  actions: read
  contents: read

jobs:
  upgrade:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/vinyl-desktop
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 707578473a6172b7e1d06750ee1c8a1971e090a1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Retrieve the freshly compiled 0.2.1 Setup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: '45331986361'
          name: NexusDownloader-Windows-x64
          path: ${{ runner.temp }}/vinyl-current
      - name: Retrieve the original 0.2.0 Setup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: '44573239540'
          name: NexusDownloader-Windows-x64
          path: ${{ runner.temp }}/vinyl-previous
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Repeat the upgrade that left all downloads queued on 0.2.0
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'vinyl-current\NexusDownloader-0.2.1-Windows-x64-Setup.exe'
          $previous = Join-Path $env:RUNNER_TEMP 'vinyl-previous\NexusDownloader-0.2.0-Windows-x64-Setup.exe'
          $hash = (Get-Content -Raw -LiteralPath "$setup.sha256").Trim().Split(' ')[0]
          if ((Get-FileHash -LiteralPath $setup).Hash -ne $hash) { throw 'Incorrect new Setup checksum' }
          if ((Get-FileHash -LiteralPath $previous).Hash -ne '3db89ec0628f613474dea56930593e4b4dde93913e6e5961a9609accd1b24ca7') { throw 'Wrong original installer' }
          try {
            .\verification\windows\verify-managed-first-run.ps1 -Setup $setup -PreviousSetup $previous -Check (Resolve-Path verification/windows/managed-first-run.mjs).Path
          } catch {
            $message = $_.ToString()
            if ($message.Length -gt 3400) { $message = $message.Substring(0, 3400) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Vinyl in-place recovery failed::$message"
            throw
          }

  retrieve-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '45331986361'
      SOURCE_SHA: '707578473a6172b7e1d06750ee1c8a1971e090a1'
      SOURCE_ARTIFACT: '14892646733'
      SOURCE_ZIP_SHA: 'fb3f25c429c5f952cdaebdc913f440c40e6e0e869a2472bf313580a806c3531e'
    steps:
      - name: Transfer the verified Setup, encrypted for the workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status > /dev/null
          run=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,headBranch)
          jq -e --arg sha "$SOURCE_SHA" --arg branch "$GITHUB_REF_NAME" '.status == "completed" and .conclusion == "success" and .headSha == $sha and .headBranch == $branch' <<<"$run" > /dev/null
          cd "$(mktemp -d "$RUNNER_TEMP/verified-setup.XXXXXX")"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > setup.zip 2> download.err; then
            echo '::error::GitHub runner could not retrieve the verified artifact.'
            exit 1
          fi
          printf '%s  setup.zip\n' "$SOURCE_ZIP_SHA" | sha256sum -c --strict
          name=NexusDownloader-0.2.1-Windows-x64-Setup.exe
          [[ "$(unzip -Z1 setup.zip | LC_ALL=C sort)" == "$(printf '%s\n' "$name" "$name.sha256")" ]]
          unzip -qq setup.zip "$name" "$name.sha256"
          size=$(stat -c '%s' "$name")
          [[ "$size" -gt 0 && "$size" -lt 40000000 ]]
          expected=$(sha256sum "$name" | cut -d' ' -f1)
          [[ "$(tr -d '\r' < "$name.sha256")" == "$expected  $name" ]]
          cat > public.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIEPzCCAqegAwIBAgIUdxOYaXfjd0q8/EHvzErWcwM3qiIwDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkTmV4dXNEb3dubG9hZGVyIDAuMi4xIHZlcmlmaWVkIFNl
          dHVwMB4XDTI2MTEyNDA1MjExN1oXDTI2MTEyNjA1MjExN1owLzEtMCsGA1UEAwwk
          TmV4dXNEb3dubG9hZGVyIDAuMi4xIHZlcmlmaWVkIFNldHVwMIIBojANBgkqhkiG
          9w0BAQEFAAOCAY8AMIIBigKCAYEArPClYvNrcxdbEwKKeYjQJ6vLsDqD+eSdUtpF
          Ia43/ZS+EWLaQ/COrngUH0Nid6q3Q6Vx7H7cyaO32OM1OJrWQI06Q5OJ5k0vFePN
          BDjGFZMmUztMQRedFlVCpdo9AI41WTigo0gBtbyXqaXZteEz+0+dL+F8flepUFeF
          C7Umrg+eYMBqXExqXhMH6Fb3W9p9dU1eqOf+GeK1v8vWf0yqakHuGlKgJY3CPeWM
          QX7eq/rECmkiPfeJgC81NgzTvzB+xvylmGu48mB20c97ATxRPYtJmzwXDhtVQGuL
          OnlsonuHNwADbtu85Ow7y5GJfAhXkbIYFcVuXxMV2ir7NgdSZ3wmu4KIblbgPIc8
          NHr0VPxSp2/IY3/lU0koKESU2iZzfYm3nRszZqgLIez3U3vsxg1sKjPhr4vUg/Ku
          1y5J+FKiMCcSUps/law2B+CRU7QGnOluIJNG+bs2un4RI9n7mOTiH3GULjkwKL7L
          0r2d5Aq6ceZ662Xb4qOKhwya5JpFAgMBAAGjUzBRMB0GA1UdDgQWBBS7d0IL22pr
          /R91OIX45mdTPP1SVzAfBgNVHSMEGDAWgBS7d0IL22pr/R91OIX45mdTPP1SVzAP
          BgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQAVQexiu3Lbc0ssqyqb
          0PATOA6lCvw4BbNbJzcxfOPfImv0EbCUBXKmiFciueUDdaqJpWuVzu9gL22lBRq8
          6gIyC48Q1ujL5a2IY7QSUhDwkgVAZQmdo1BQnJe3MAKT8Iv0vbq4fpRK+LQlY8lV
          22x7Wt8C/1+Vk7/I6BrHZ0X6qkw1xR8VtNQAyo5rJj8m6lCVV6fJv7e8BgtoyveD
          SIj7TigfeQAIvTuVNNTFCKt83sw1b5RGOp9j3TTsVPcX6EYeYW0VruPGxp/O+LKZ
          w0YMlt6Kq/u47XXrhkAOM08Ja1NTTcFxtOYd1fYtQF7HNKMrxE7riXq6ie1008dP
          vfxLxhnDuJ3pQSLEJhOWG7KGBLogNj+Q2wDEw61EIyNW7umaqe0Wn3mCGp27dqXA
          ix00LnjicfnTexpHDw4xN+owI3xSPjY8KYXKZFc3iigoQUiNwuKppODBatFip7Ed
          BVLh4CcLsrIXKfvGxu6CQEiEyFtOFIIVMN7rcL6kT81XW3U=
          -----END CERTIFICATE-----
          CERTIFICATE
          openssl cms -encrypt -binary -aes256 -in "$name" -outform DER -out setup.der public.pem
          encrypted_sha=$(sha256sum setup.der | cut -d' ' -f1)
          split -b 640k -d -a 3 setup.der chunk-
          blobs=()
          for piece in chunk-*; do
            id=$(python3 -c 'import base64,json,sys;print(json.dumps({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode("ascii")}))' < "$piece" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            [[ "$id" == "$(git hash-object "$piece")" ]]
            blobs+=("$id")
          done
          printf '::notice title=Verified Vinyl Setup 45331986361::%s %s %s %s\n' "$expected" "$encrypted_sha" "$size" "${blobs[*]}"

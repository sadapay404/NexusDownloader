name: Check delivered Vinyl Setup from a clean Windows profile

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths:
      - '.github/workflows/vinyl-clean-start-check.yml'
      - '.github/verification/*vinyl-clean-start.*'

permissions:
  contents: read
  actions: read

jobs:
  clean-start:
    runs-on: windows-2025
    timeout-minutes: 14
    defaults:
      run:
        working-directory: apps/vinyl-desktop
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Retrieve the exact delivered Setup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: '45327723644'
          name: NexusDownloader-Windows-x64
          path: ${{ runner.temp }}/vinyl-delivered
      - name: Install verification dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Install and exercise delivered Setup without tool overrides
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'vinyl-delivered\NexusDownloader-0.2.0-Windows-x64-Setup.exe'
          if ((Get-FileHash -LiteralPath $setup).Hash -ne '295925855bfd619ab4d22bdd24d7954adb4a8024f5d3f61268300dafa7d5fbd4') {
            throw 'This is not the delivered installer'
          }
          Copy-Item ../../.github/verification/vinyl-clean-start.mjs verification/windows/vinyl-clean-start.mjs
          try {
            & ../../.github/verification/verify-vinyl-clean-start.ps1 -Setup $setup -Check (Resolve-Path verification/windows/vinyl-clean-start.mjs).Path
          } catch {
            $message = $_.ToString()
            if ($message.Length -gt 3400) { $message = $message.Substring(0, 3400) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Delivered Vinyl clean-start result::$message"
            throw
          }

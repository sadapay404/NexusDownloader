name: Vinyl Windows run inspection

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths: ['.github/workflows/vinyl-run-inspection.yml']

permissions:
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '45326627181'
      SOURCE_SHA: 'b42ed25150cf103dc1aad6f1e7060abf4ecc5363'
    steps:
      - name: Read the Windows backend failure
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --interval 20
          run=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headBranch,headSha,conclusion)
          [[ $(jq -r .headBranch <<<"$run") == "$GITHUB_REF_NAME" && $(jq -r .headSha <<<"$run") == "$SOURCE_SHA" && $(jq -r .conclusion <<<"$run") == failure ]]
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failure.log"
          python3 - "$RUNNER_TEMP/failure.log" <<'PY'
          from pathlib import Path
          import sys
          logs = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          lines = [line.split('\t')[-1] for line in logs if 'Test locked Rust backend on Windows' in line]
          if not lines:
              raise RuntimeError('No Windows backend failure was found')
          tail = '\n'.join(lines)[-15000:]
          for i, offset in enumerate(range(0, len(tail), 3000), 1):
              message = tail[offset:offset + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Vinyl backend failure part {i}::{message}')
          PY

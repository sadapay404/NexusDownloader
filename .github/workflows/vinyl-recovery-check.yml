name: Verify Vinyl 0.2.1 in-place recovery

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths: ['.github/workflows/vinyl-recovery-check.yml']

permissions:
  actions: read
  contents: read

jobs:
  upgrade:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/vinyl-desktop
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a1b24414d03b4075719112aa10f182f7b02b2a8b
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Retrieve the freshly compiled 0.2.1 Setup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: '45330921245'
          name: NexusDownloader-Windows-x64
          path: ${{ runner.temp }}/vinyl-current
      - name: Retrieve the original 0.2.0 Setup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: '44573239540'
          name: NexusDownloader-Windows-x64
          path: ${{ runner.temp }}/vinyl-previous
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Repeat the upgrade that left all downloads queued on 0.2.0
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'vinyl-current\NexusDownloader-0.2.1-Windows-x64-Setup.exe'
          $previous = Join-Path $env:RUNNER_TEMP 'vinyl-previous\NexusDownloader-0.2.0-Windows-x64-Setup.exe'
          $hash = (Get-Content -Raw -LiteralPath "$setup.sha256").Trim().Split(' ')[0]
          if ((Get-FileHash -LiteralPath $setup).Hash -ne $hash) { throw 'Incorrect new Setup checksum' }
          if ((Get-FileHash -LiteralPath $previous).Hash -ne '3db89ec0628f613474dea56930593e4b4dde93913e6e5961a9609accd1b24ca7') { throw 'Wrong original installer' }
          try {
            .\verification\windows\verify-managed-first-run.ps1 -Setup $setup -PreviousSetup $previous -Check (Resolve-Path verification/windows/managed-first-run.mjs).Path
          } catch {
            $message = $_.ToString()
            if ($message.Length -gt 3400) { $message = $message.Substring(0, 3400) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Vinyl in-place recovery failed::$message"
            throw
          }

  retrieve-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '45330921245'
      SOURCE_SHA: 'a1b24414d03b4075719112aa10f182f7b02b2a8b'
      SOURCE_ARTIFACT: '14891917312'
      SOURCE_ZIP_SHA: 'ad01ce8c1e3eb6ffe6b8df64a47c718e037a79ec22b731afef6d443f94aca75c'
    steps:
      - name: Transfer the verified Setup, encrypted for the workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status > /dev/null
          run=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,headBranch)
          jq -e --arg sha "$SOURCE_SHA" --arg branch "$GITHUB_REF_NAME" '.status == "completed" and .conclusion == "success" and .headSha == $sha and .headBranch == $branch' <<<"$run" > /dev/null
          cd "$(mktemp -d "$RUNNER_TEMP/verified-setup.XXXXXX")"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > setup.zip 2> download.err; then
            echo '::error::GitHub runner could not retrieve the verified artifact.'
            exit 1
          fi
          printf '%s  setup.zip\n' "$SOURCE_ZIP_SHA" | sha256sum -c --strict
          name=NexusDownloader-0.2.1-Windows-x64-Setup.exe
          [[ "$(unzip -Z1 setup.zip | LC_ALL=C sort)" == "$(printf '%s\n' "$name" "$name.sha256")" ]]
          unzip -qq setup.zip "$name" "$name.sha256"
          size=$(stat -c '%s' "$name")
          [[ "$size" -gt 0 && "$size" -lt 40000000 ]]
          expected=$(sha256sum "$name" | cut -d' ' -f1)
          [[ "$(tr -d '\r' < "$name.sha256")" == "$expected  $name" ]]
          cat > public.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIEQTCCAqmgAwIBAgIUJkOZBmyYLJWRCDXk6dc6wqtnSgkwDQYJKoZIhvcNAQEL
          BQAwMDEuMCwGA1UEAwwlTmV4dXNEb3dubG9hZGVyIDAuMi4xIFNldHVwIHJldHJp
          ZXZhbDAeFw0yNjExMjQwNTEzMTdaFw0yNjExMjYwNTEzMTdaMDAxLjAsBgNVBAMM
          JU5leHVzRG93bmxvYWRlciAwLjIuMSBTZXR1cCByZXRyaWV2YWwwggGiMA0GCSqG
          SIb3DQEBAQUAA4IBjwAwggGKAoIBgQDX6ryvu+4dMLNAa+UHeK09/4NiF2O5L9R0
          hywOZLdj2sEAnU6kA4+rFyrua1GFfOm2lZMGZHD7NidqGwLKGijgJeGbL/+JFM7z
          uxAq+zh9i8bXPL/El+TA/4hTfw1l1TpocUFdmXGx77hdqXXa0qfl5sQUwY+5ZGEe
          bP7XrjCn0mnS1Nr1Z7AK4hxpco8NcweAAoC74gRndFbYyc+tu2m02yFeXzpWDsfS
          X2mpBjtQBm3WRbUN6u1rNDkzFfeo/55NLu7SEdXjrkRZTDFB3SiuehUSQ2etf030
          265tJqcduPjr9trE+4A9/AoDGc+cURDaylG6zn4jWihGbSuEWhLPkEG1YciGnl3i
          m9kTJ/bGtfgqJNglP9hApAtmdDOdXJAEhC66H28AQe/zqDOap0RpBi35FEWBeZrf
          TT9ecQzCKBd1//9iNLq+roqcyeFeSf/q57md+CwoSVrysBmk8dMrrzJgbbMBVDTI
          7bcarUEW3UVr8jIXaTWTS6TbVt3E3pUCAwEAAaNTMFEwHQYDVR0OBBYEFGB/h/59
          NyztqeV7E6ulxTwJ5ATTMB8GA1UdIwQYMBaAFGB/h/59NyztqeV7E6ulxTwJ5ATT
          MA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAFFnSpRR4TZd7qHd
          1Olf3SgtQ/8Tk2rTIOAmJdkcSfTVQb9L8vPo3oh8Go7YSVaydcDIekLzux7nvjd7
          ST6rKWXnnxP8K7co5CWdYrIvKbjvQtNzp9kiwVBDvyz7YiOkKzscCMIULGXtq1ax
          hr9cL0KfGC6OEAjE0PBQkT81GETb+MvQhEddlWXsSFK3RFcXKgmX/rrCXO+vehXc
          Ry4rxXRYREoXh/OmIOSpqwqLqYpC9Ht+H7eg/a2kTgfclbqQ+abJR3PKUc0OEZxA
          zdrD42eZpX+KWCM94v6Sd2JvfVJfxA5wp4hq7TxiY09OpO6H+Y+MS0DssnpxYcQ1
          L8zpmaEmadMwp/DbYQC50eYQv/W4LOUOt7kYna8/bUGqHO3L1ZXgzUst1fWFoClD
          sIwXRXg5QFvle4tIep0Lgkhp8bVCSYjgnhYCJnBnL1cQAOjGwZCV67PkED2LkxIE
          /AWwpJl0NBfCoO04w0UunDrtS22XKNKTTeFltr7V2GsFq+YN8A==
          -----END CERTIFICATE-----
          CERTIFICATE
          openssl cms -encrypt -binary -aes256 -in "$name" -outform DER -out setup.der public.pem
          encrypted_sha=$(sha256sum setup.der | cut -d' ' -f1)
          split -b 640k -d -a 3 setup.der chunk-
          blobs=()
          for piece in chunk-*; do
            id=$(python3 -c 'import base64,json,sys;print(json.dumps({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode("ascii")}))' < "$piece" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            [[ "$id" == "$(git hash-object "$piece")" ]]
            blobs+=("$id")
          done
          printf '::notice title=Verified Vinyl Setup 45330921245::%s %s %s %s\n' "$expected" "$encrypted_sha" "$size" "${blobs[*]}"

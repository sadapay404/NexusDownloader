name: Vinyl Windows x64

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths:
      - 'apps/vinyl-desktop/**'
      - '.github/workflows/vinyl-windows.yml'
  workflow_dispatch:
    inputs:
      native_soak:
        description: Run an additional 60-minute installed Windows soak with synthetic media
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vinyl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/vinyl-desktop
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      RUSTUP_TOOLCHAIN: '1.100.0-x86_64-pc-windows-msvc'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Verify pinned upstream and fork sources
        run: node scripts/verification/verify-source.mjs
      - name: Install Rust and pnpm
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          rustc --version
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Check frontend dependency advisories
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm audit --prod
          pnpm audit
      - name: Test renderer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm lint
          pnpm test
          pnpm build
          pnpm exec playwright install chromium
          pnpm test:ui
      - name: Cache locked Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/vinyl-desktop/src-tauri -> target
          cache-on-failure: 'true'
      - name: Test locked Rust backend on Windows
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'vinyl-rust-tests.log'
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            $summary = (Get-Content -LiteralPath $log -Tail 45) -join "`n"
            if ($summary.Length -gt 3200) { $summary = $summary.Substring($summary.Length - 3200) }
            $summary = $summary.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Vinyl Windows Rust verification failed::$summary"
            exit $code
          }
      - name: Build Tauri x64 NSIS Setup
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'tauri-build.log'
          # Splat a literal separator: PowerShell otherwise strips bare -- before cargo args.
          $argsForTauri = @('node_modules/@tauri-apps/cli/tauri.js', 'build', '--target', 'x86_64-pc-windows-msvc', '--bundles', 'nsis', '--ci', '--no-sign', '--', '--locked')
          node @argsForTauri 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            $summary = ((Get-Content $log -Tail 28) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Tauri x64 build failed::$summary"
            exit $code
          }
      - name: Verify Setup, installed native regressions and uninstall
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -File -Filter '*_x64-setup.exe')
          if ($setups.Count -ne 1) { throw 'Expected one Tauri x64 Setup executable' }
          try {
            .\verification\windows\verify-installer.ps1 -Setup $setups[0].FullName -Output "$env:RUNNER_TEMP\NexusDownloader-Windows-x64" -UseRunnerWebView2Policy
          } catch {
            $summary = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer verification failed::$summary"
            throw
          }
      - name: Upload verified Setup and SHA-256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NexusDownloader-Windows-x64
          path: ${{ runner.temp }}/NexusDownloader-Windows-x64/*
          if-no-files-found: error
          retention-days: 14

  windows-native-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.native_soak
    needs: windows-x64
    runs-on: windows-2025
    timeout-minutes: 100
    defaults:
      run:
        working-directory: apps/vinyl-desktop
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Check out verification sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Install locked verification tooling
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Retrieve the verified Setup from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NexusDownloader-Windows-x64
          path: ${{ runner.temp }}/Vinyl-Setup
      - name: Verify Setup and run a real one-hour installed soak
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\Vinyl-Setup" -File -Filter '*-Setup.exe')
          if ($files.Count -ne 1) { throw 'Expected one previously verified Setup' }
          $setup = $files[0].FullName
          $hash = (Get-Content -Raw -LiteralPath "$setup.sha256").Trim().Split(' ')[0]
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne $hash) { throw 'Setup checksum mismatch' }
          .\verification\windows\verify-installer.ps1 -Setup $setup -Output "$env:RUNNER_TEMP\Soak-verified" -UseRunnerWebView2Policy -NativeSoakMinutes 60

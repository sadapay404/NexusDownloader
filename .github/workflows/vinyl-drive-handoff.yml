name: Retrieve verified Vinyl installer for Drive

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths: ['.github/workflows/vinyl-drive-handoff.yml']

permissions: {}

jobs:
  retrieve-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '45852555520'
      SOURCE_SHA: '26c4a0b0f36309647ec821ddeef5508d3719cb64'
      SOURCE_ARTIFACT: '15135520026'
      SOURCE_ZIP_SHA: '2fb038ae454eef765dfa034658f725ed58744d3ccbea17903862cc1906990572'
    steps:
      - name: Transfer the verified Setup, encrypted for the workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status > /dev/null
          run=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,headBranch)
          jq -e --arg sha "$SOURCE_SHA" --arg branch "$GITHUB_REF_NAME" '.status == "completed" and .conclusion == "success" and .headSha == $sha and .headBranch == $branch' <<<"$run" > /dev/null
          cd "$(mktemp -d "$RUNNER_TEMP/verified-setup.XXXXXX")"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > setup.zip 2> download.err; then
            echo '::error::GitHub runner could not retrieve the verified artifact.'
            exit 1
          fi
          printf '%s  setup.zip\n' "$SOURCE_ZIP_SHA" | sha256sum -c --strict
          name=NexusDownloader-0.2.0-Windows-x64-Setup.exe
          [[ "$(unzip -Z1 setup.zip | LC_ALL=C sort)" == "$(printf '%s\n' "$name" "$name.sha256")" ]]
          unzip -qq setup.zip "$name" "$name.sha256"
          size=$(stat -c '%s' "$name")
          [[ "$size" -gt 0 && "$size" -lt 40000000 ]]
          expected=$(sha256sum "$name" | cut -d' ' -f1)
          [[ "$(tr -d '\r' < "$name.sha256")" == "$expected  $name" ]]
          cat > public.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIERzCCAq+gAwIBAgIURdr+FAQGDjvVwZ3VN3/sfsT2iPkwDQYJKoZIhvcNAQEL
          BQAwMzExMC8GA1UEAwwoTmV4dXNEb3dubG9hZGVyIGFydGlmYWN0IGhhbmRvZmYg
          MjZjNGEwYjAeFw0yNjExMjYxNTQ4MTdaFw0yNjExMjgxNTQ4MTdaMDMxMTAvBgNV
          BAMMKE5leHVzRG93bmxvYWRlciBhcnRpZmFjdCBoYW5kb2ZmIDI2YzRhMGIwggGi
          MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQC1l+XxKPz/SvkjadQkOHySvel9
          8sAS5WZbTvuRWhnJwillvHnwI55aPSx8FsuKjFLLDPcQdNPkICXttOw81RWpkdzi
          brVSD+4aTdCO8WVCwb39JpKiO+QI1stm/zK9ycAdWaN5Qv6NwRSYFo84dZkrcj5l
          nb9/GCySRLPaDZuGKZ3T2NX97F7jD7lpnXg/OYfW0IKncdqwnpC3rKv5H5Mq6u2A
          ojpOcsDyI8veLYSMho7lcJGNW5CUnB4VsYUspNQT9hyZB/WL9u5DBdNshSxhOBPL
          qutXk9QHrkLmGIuZFC1C2Jf/Rr1ANZsVQABkB9oJvNDGFD9wo0a3NP8dc7D1J7vj
          C/iCjSqKaGJexSG9ktJHKDuKMPMmZEgCtRWNrx9PfzFa6ymJm3dh0dcwDK+ppERx
          FOMAYxCcxftvPGCN1Vd2xgDElPMoi+xfeG0f/H4mZkmfpUKzZ/bnuqCbS8kYpmuU
          gIkav2jNpC9AywTqDiQahYlRBk9/H2Mf91SKFmsCAwEAAaNTMFEwHQYDVR0OBBYE
          FOQ4ZK5I4NwkxqeAjSrELlwMuWtFMB8GA1UdIwQYMBaAFOQ4ZK5I4NwkxqeAjSrE
          LlwMuWtFMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAKi4lxAx
          HmO5PuZRzUw+YewsGvABa3SB1rr1xIa1J5ObcIInJBeTwTn9wvZYFTRmwM3f90MQ
          3obYmInqYtV1wnwNM8zacNRfggWyyp113sCiqMs9K93oBIMQjX7VyzvFVmbBMaOo
          SO0ntMGp5C0iXDJpWHa6QvT5/EQ6Z0/IecKd++GN/2AdjiN2x6cGdhIvsgxDRiXV
          Vt+f2L4INsIho28FCXuyo/vswQGEpMkaEEBNVa/SeEuZUr2Lcu9PvNlp0GoP+lJn
          R3avONJPRt5Z4mBwTsxJlg4yfdhjBjGEyMAYimPZpym27IQDHrSaGly2P3Ymtz7I
          VzBNJw59kdYnmJj0qXae4ebPg5xBOa6v09I0pNnwJxGWbgee8xgbev/A884GkB3X
          kVQSZOHyhG97IpWBGvz9T+NQm4fN2XFjma255Nm9SU0cFkYhDNmIBPbwhs1yKOLF
          38wg2ALnt5eekgqjixXKnWxSsh80mw8jW0SWIiznuaKFY1LdGK5xx47YDw==
          -----END CERTIFICATE-----
          CERTIFICATE
          openssl cms -encrypt -binary -aes256 -in "$name" -outform DER -out setup.der public.pem
          encrypted_sha=$(sha256sum setup.der | cut -d' ' -f1)
          split -b 640k -d -a 3 setup.der chunk-
          blobs=()
          for piece in chunk-*; do
            id=$(python3 -c 'import base64,json,sys;print(json.dumps({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode("ascii")}))' < "$piece" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            [[ "$id" == "$(git hash-object "$piece")" ]]
            blobs+=("$id")
          done
          printf '::notice title=Verified Vinyl Setup 45852555520::%s %s %s %s\n' "$expected" "$encrypted_sha" "$size" "${blobs[*]}"

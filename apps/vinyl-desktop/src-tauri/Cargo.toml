[package]
name = "yt-dlp-gui"
version = "1.0.0"
description = "A modern GUI for yt-dlp"
authors = ["imsyy"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yt_dlp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
regex = "1"
reqwest = { version = "0.13.2", features = ["stream", "socks", "gzip"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
axum = "0.8"
futures-util = "0.3.32"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.4"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
which = "7"
url = "2.5.9"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

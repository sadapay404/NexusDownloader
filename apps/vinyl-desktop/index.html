<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nexus-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>NexusDownloader</title>
  </head>

  <body>
    <div id="app">
      <div id="loading-screen">
        <svg class="spinner" viewBox="0 0 50 50">
          <circle cx="25" cy="25" r="20" fill="none" stroke-width="4" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition:
          opacity 0.2s,
          background 0.2s;
        z-index: 9999;
      }
      #loading-screen.dark {
        background: #121212;
      }
      #loading-screen .spinner {
        width: 36px;
        height: 36px;
        animation: spin 0.8s linear infinite;
      }
      #loading-screen .spinner circle {
        stroke: #999;
        stroke-dasharray: 90, 150;
        stroke-dashoffset: 0;
      }
      #loading-screen.dark .spinner circle {
        stroke: #d4af37;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

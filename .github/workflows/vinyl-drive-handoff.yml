name: Retrieve verified Vinyl installer for Drive

on:
  push:
    branches: [arena/ff958846-nexusdownloader]
    paths: ['.github/workflows/vinyl-drive-handoff.yml']

permissions: {}

jobs:
  retrieve-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '45838569033'
      SOURCE_SHA: 'e7d99f5d47836588dc703f659d943eac5aac7327'
      SOURCE_ARTIFACT: '15127493253'
      SOURCE_ZIP_SHA: 'afb0368129a11a1fbd89d9f72b10be70b1b25d1091993ef38d37f3caec2cbc5f'
    steps:
      - name: Transfer the verified Setup, encrypted for the workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status > /dev/null
          run=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,headBranch)
          jq -e --arg sha "$SOURCE_SHA" --arg branch "$GITHUB_REF_NAME" '.status == "completed" and .conclusion == "success" and .headSha == $sha and .headBranch == $branch' <<<"$run" > /dev/null
          cd "$(mktemp -d "$RUNNER_TEMP/verified-setup.XXXXXX")"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > setup.zip 2> download.err; then
            echo '::error::GitHub runner could not retrieve the verified artifact.'
            exit 1
          fi
          printf '%s  setup.zip\n' "$SOURCE_ZIP_SHA" | sha256sum -c --strict
          name=NexusDownloader-0.2.0-Windows-x64-Setup.exe
          [[ "$(unzip -Z1 setup.zip | LC_ALL=C sort)" == "$(printf '%s\n' "$name" "$name.sha256")" ]]
          unzip -qq setup.zip "$name" "$name.sha256"
          size=$(stat -c '%s' "$name")
          [[ "$size" -gt 0 && "$size" -lt 40000000 ]]
          expected=$(sha256sum "$name" | cut -d' ' -f1)
          [[ "$(tr -d '\r' < "$name.sha256")" == "$expected  $name" ]]
          cat > public.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIERzCCAq+gAwIBAgIUZEVgHtVS0nYyAhmutO2gT/Z5V+kwDQYJKoZIhvcNAQEL
          BQAwMzExMC8GA1UEAwwoTmV4dXNEb3dubG9hZGVyIGFydGlmYWN0IGhhbmRvZmYg
          ZTdkOTlmNTAeFw0yNjExMjYxNDI3NDVaFw0yNjExMjgxNDI3NDVaMDMxMTAvBgNV
          BAMMKE5leHVzRG93bmxvYWRlciBhcnRpZmFjdCBoYW5kb2ZmIGU3ZDk5ZjUwggGi
          MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQDBLlOY+e22kZVqYYhD5SyIcz5u
          8nMSeHsWL3JXaBV8SlzTft+fukST8hZ33c622wyxJb1VCXv0Kn6xaSgYtOWdr8j+
          yCf38RFW4OQm9hdApIfLSfO4yhMQ+uIj3BbZA8ZktCC/sskdokc/fMhoEF2R+KI3
          e0YViscRoWOrLkgqkuBxh9fZ63wdOTopxxQpKdsjQ6+LGoSQsgTUkJ+RlNRAsuPk
          vhmBgxVNljKGSq52xZXBSIc37vmVxuefDFb/cgb1UdFbdOuMifo7/q3WlcKpgYkJ
          FUom6mt23EFTN7YGOIaXfriofCLdQ4M5vRbwHnA/jMjAk1JheuMwvOcafHFZ4b7A
          hMtq1Fd6xh94AyZSrOZielMuPL45/avCjLkFPtizf9GGSBhxxoOqdsINC7jil9vm
          tuaP7mStnEvzInHDuRP4BO7e5tNTBQSUGcCjUyY34UtV7j8wT7dKSswJScfT9amM
          aFmmIrNa1HBR2kW/uTh56JdMReaGkrHKCPl5xLcCAwEAAaNTMFEwHQYDVR0OBBYE
          FCgZhk4fnd1dLQS8aoURr9oMCu9EMB8GA1UdIwQYMBaAFCgZhk4fnd1dLQS8aoUR
          r9oMCu9EMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAJDXU0Hg
          S6CfR9LDgvEtue5O3NwDUk6TxSSwE2PURdq4kiGo8Zzpp+JU3cqF5orlTMAA5qPh
          ZcHVMXRG7RsroDeQXKlT1XRs6jBEUhBo/9iV/grN5D+xVJG+hwCUc+pMKq0mTENY
          BB3cDUog4bn+WywtjQAO1YUorycliIW5J5YOc12kn7h0h/YPY6BQavgIwY/fSKYZ
          XcXOq43fMIlq1G0ngtHQVyVrrxwoO9Sc55Xi0tVb/bGQJO9yy5BSdfK3rEUwMrVz
          pnP6Eh8mMCZmBegvmiee7jNe9aTicNNVVEZAXgjZi0uZZvm5ByJ2W9sMP+h8zv5y
          JXIeBcadTojqtdbCbeCgt3D//QfzQtLUhOBXTuX8Ak2s/pJ3/QtxtKkiUB4ZBVFX
          JaeBAvyJcjNkkwxHc6h5wGT+ZKKx2IwOMTQTfm8Pbg2o1/zst79csEHdJTNPCHCm
          wlgkfjgGKhpYZ7YolyuxvPfHaX3WQsfRbmBj232ZqV04+iJnaSwpFdEkHQ==
          -----END CERTIFICATE-----
          CERTIFICATE
          openssl cms -encrypt -binary -aes256 -in "$name" -outform DER -out setup.der public.pem
          encrypted_sha=$(sha256sum setup.der | cut -d' ' -f1)
          split -b 640k -d -a 3 setup.der chunk-
          blobs=()
          for piece in chunk-*; do
            id=$(python3 -c 'import base64,json,sys;print(json.dumps({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode("ascii")}))' < "$piece" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            [[ "$id" == "$(git hash-object "$piece")" ]]
            blobs+=("$id")
          done
          printf '::notice title=Verified Vinyl Setup 45838569033::%s %s %s %s\n' "$expected" "$encrypted_sha" "$size" "${blobs[*]}"
